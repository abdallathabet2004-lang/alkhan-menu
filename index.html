<!DOCTYPE html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>الخان - مملكة الروقان</title>
<link href="https://fonts.googleapis.com/css2?family=Noto+Kufi+Arabic:wght@500;600;800&family=Lalezar&display=swap" rel="stylesheet">
<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#fdeedd;--ink:#2b1608;--or:#f9a11b;--br:#e8951d;--mut:#8a6f55}
html{scroll-padding-top:70px}*{box-sizing:border-box}
body{margin:0;background:var(--bg) url("data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' width='90' height='90'><g fill='none' stroke='%23e6bd82' stroke-opacity='.45' stroke-width='1.6'><ellipse cx='25' cy='25' rx='11' ry='17' transform='rotate(35 25 25)'/><path d='M17 35 Q27 25 33 15' transform='rotate(0)'/><ellipse cx='68' cy='66' rx='11' ry='17' transform='rotate(-30 68 66)'/><path d='M60 56 Q68 66 76 76'/></g></svg>");color:var(--ink);font-family:'Noto Kufi Arabic',Tahoma,sans-serif}
.hero{position:relative}.hero img{display:block;width:100%;height:auto}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--bg);padding:8px 12px;border-bottom:1px solid #f0d5ae}
.bar input{width:100%;padding:10px 14px;border-radius:12px;border:1.5px solid var(--br);background:#fff8ef;font:inherit;font-size:15px;color:var(--ink)}
.tabs{display:flex;gap:8px;overflow-x:auto;padding-top:8px}
.tabs button{flex:none;border:0;border-radius:18px;padding:7px 16px;font:inherit;font-size:15px;background:#fff8ef;color:var(--ink);border:1.5px solid var(--br)}
.tabs button.on{background:var(--or);font-weight:700}
.pg{position:relative;margin:16px 12px;border:2px solid var(--br);border-radius:22px;padding:18px 14px 46px;max-width:560px;margin-inline:auto;overflow:hidden}
@media(max-width:600px){.pg{margin-inline:12px}}
.logo{position:absolute;top:12px;left:16px;text-align:center;color:#a2622a;line-height:1}
.logo b{font-family:'Aref Ruqaa',serif;font-size:30px;display:block}.logo small{font-size:9px;letter-spacing:2px}
.ttl{font-family:Lalezar,'Noto Kufi Arabic',sans-serif;font-size:34px;margin:0 0 6px;padding-top:6px;display:flex;align-items:center;gap:10px}
.ic{height:52px;width:auto;mix-blend-mode:multiply}.wm{position:absolute;bottom:34px;left:-18px;width:62%;opacity:.16;mix-blend-mode:multiply;pointer-events:none;z-index:0}.rows,.sub,.hd{position:relative;z-index:1}
.sub{font-size:13px;color:var(--mut);margin:14px 0 2px}
.hd{display:flex;padding:8px 0 4px;font-size:13px;color:var(--mut)}.hd span{width:54px;text-align:center;margin-inline-end:0}.hd span+span{margin-inline-start:6px}
.r{display:flex;align-items:center;min-height:44px}
.pc{width:54px;align-self:stretch;display:flex;align-items:center;justify-content:center;background:var(--or);font-size:18px;font-weight:800}
.pc+.pc{margin-inline-start:6px}.pc.n{font-size:15px;font-weight:500}
.rows .r:first-child .pc{border-radius:10px 10px 0 0}.rows .r:last-child .pc{border-radius:0 0 10px 10px}
.rows .r:only-child .pc{border-radius:10px}
.nm{padding:0 12px;font-size:15.5px;font-weight:600;line-height:1.4}
.num{position:absolute;bottom:-1px;left:50%;transform:translateX(-50%);background:#3d1b0a;color:#fff;border-radius:10px 10px 0 0;width:44px;text-align:center;font-family:Lalezar;font-size:22px;padding:2px 0}
.none{text-align:center;color:var(--mut);padding:30px}
.end{position:relative;margin-top:24px}.end img{display:block;width:100%}
.info{position:absolute;bottom:60px;width:100%;text-align:center;color:#fff;font-size:16px;line-height:1.9}
.info a{color:#ffe6a8;font-size:22px;text-decoration:none;font-weight:700;direction:ltr;display:inline-block}
</style>

const ICONMAP={"مشروبات ساخنة":"c","ساقع + فريشات":"s","ركن الشيشة":"h"};
function iconFor(name){
  if(name.indexOf("ساخن")>-1)return "c";
  if(name.indexOf("شيش")>-1)return "h";
  if(name.indexOf("اضاف")>-1)return "h";
  return "s";
}
let CATS=[];
const $=id=>document.getElementById(id),m=$('m'),tabs=$('tabs'),q=$('q');
const c=v=>`<div class="pc${v===null?' n':''}">${v===null?'-':v}</div>`;
function render(){
  const s=q.value.trim();let h='';
  CATS.forEach((cat,pi)=>{
    const rows=cat.items.filter(it=>!it.hidden && (!s || it.name.indexOf(s)>-1));
    if(!rows.length)return;
    const ic=iconFor(cat.name);
    let body='';
    if(cat.two)body+='<div class="hd"><span>L</span><span>XL</span></div>';
    body+='<div class="rows">'+rows.map(it=>`<div class="r">${cat.two?c(it.l)+c(it.xl):c(it.price)}<div class="nm">${it.name}</div></div>`).join('')+'</div>';
    h+=`<section class="pg" id="p${pi}"><div class="logo"><b>الخان</b><small>ALKHAN</small></div><img class="wm" src="${IMG[ic]}" alt=""><h2 class="ttl"><img class="ic" src="${IMG[ic]}" alt="">${cat.name}</h2>${body}<div class="num">${pi+1}</div></section>`;
  });
  m.innerHTML=h||'<div class="none">مفيش نتائج</div>';
}
function buildTabs(){
  tabs.innerHTML='';
  CATS.forEach((cat,i)=>{
    const b=document.createElement('button');
    b.textContent=cat.name;
    b.onclick=()=>{q.value='';render();document.getElementById('p'+i)?.scrollIntoView({behavior:'smooth'});[...tabs.children].forEach(x=>x.classList.remove('on'));b.classList.add('on')};
    tabs.appendChild(b);
  });
}
async function load(){
  try{
    const r=await fetch('/api/menu');
    CATS=await r.json();
    buildTabs();render();
  }catch(e){
    m.innerHTML='<div class="none">تعذر تحميل المنيو، حاول تحديث الصفحة</div>';
  }
}
q.oninput=render;
load();
</script>
</body></html>
